      .small { font: 500 12px "Microsoft YaHei", "Segoe UI", Arial, sans-serif; fill: #7F92A5; }
      .body { font: 600 15px "Microsoft YaHei", "Segoe UI", Arial, sans-serif; fill: #DCE7F1; }
      .title { font: 700 18px "Microsoft YaHei", "Segoe UI", Arial, sans-serif; fill: #F4F8FB; }
      .money { font: 800 54px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; fill: url(#gold); letter-spacing: 0; }
      .time { font: 800 34px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; fill: #F4F8FB; letter-spacing: 0; }
      .num { font: 800 24px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; fill: #F4F8FB; }
      .icon { stroke: #DCE7F1; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .mutedStroke { stroke: #3B4B5C; stroke-width: 1; }
    </style>
